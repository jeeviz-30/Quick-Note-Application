<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Note Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Quick Notes</h1>
        </header>

        <section class="note-form-container">
            <form id="note-form">
                <input type="text" id="note-title" placeholder="Note Title..." required />
                <textarea id="note-content" placeholder="Take a note..." rows="4" required></textarea>
                <button type="submit" id="save-btn">Add Note</button>
            </form>
        </section>

        <section class="notes-container">
            <h2>Your Notes</h2>
            <div id="notes-list" class="notes-grid"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
